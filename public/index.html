<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grass Fresh Market - Socket Test Client</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --border: #334155;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-disconnected {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .badge-connected {
      background: #14532d;
      color: #86efac;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 18px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    input,
    button {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      flex: 1;
      min-width: 180px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #022c22;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.btn-secondary {
      background: #475569;
      color: var(--text);
    }

    button.btn-secondary:hover {
      background: #64748b;
    }

    button.btn-danger {
      background: var(--danger);
      color: white;
    }

    #logs {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .log-item {
      margin-bottom: 6px;
    }

    .log-time {
      color: var(--text-muted);
    }

    .log-in {
      color: #38bdf8;
    }

    .log-out {
      color: #4ade80;
    }

    .log-sys {
      color: #fbbf24;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>🌱 Grass Fresh Market Socket Client</h1>
      <span id="status-badge" class="badge badge-disconnected">● Disconnected</span>
    </header>

    <div class="card">
      <h2>Connection Info</h2>
      <div class="row">
        <div><strong>Socket ID:</strong> <span id="socket-id" style="color: #38bdf8;">Not connected</span></div>
      </div>
      <div class="row">
        <button id="btn-reconnect" class="btn-secondary">Reconnect</button>
        <button id="btn-ping">Ping Latency Check</button>
      </div>
    </div>

    <div class="card">
      <h2>Rooms (Market / Order / Topic)</h2>
      <div class="row">
        <input type="text" id="room-input" placeholder="e.g. market_chennai or order_12345" />
        <button id="btn-join">Join Room</button>
        <button id="btn-leave" class="btn-secondary">Leave Room</button>
      </div>
      <div style="font-size: 0.9rem; color: var(--text-muted);">
        Active Joined Rooms: <span id="active-rooms" style="color: #a78bfa;">None</span>
      </div>
    </div>

    <div class="card">
      <h2>Broadcast / Emit Event</h2>
      <div class="row">
        <input type="text" id="target-room" placeholder="Target room (optional, leave empty for global broadcast)" />
      </div>
      <div class="row">
        <input type="text" id="msg-input" placeholder="Message content (e.g. New fresh stock arrived!)" />
        <button id="btn-send">Send Broadcast</button>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <h2>Event Logs</h2>
        <button id="btn-clear" class="btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">Clear Logs</button>
      </div>
      <div id="logs"></div>
    </div>
  </div>

  <script>
    const socket = io("https://grace-fresh-market-socket.vercel.app");
    const statusBadge = document.getElementById('status-badge');
    const socketIdSpan = document.getElementById('socket-id');
    const logsDiv = document.getElementById('logs');
    const activeRoomsSpan = document.getElementById('active-rooms');
    const joinedRooms = new Set();

    function addLog(type, message, data = null) {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = 'log-item';
      let tagClass = 'log-sys';
      let prefix = '[SYSTEM]';

      if (type === 'in') {
        tagClass = 'log-in';
        prefix = '[INCOMING]';
      } else if (type === 'out') {
        tagClass = 'log-out';
        prefix = '[OUTGOING]';
      }

      div.innerHTML = `<span class="log-time">[${time}]</span> <span class="${tagClass}">${prefix}</span> ${message} ${data ? `<pre style="color: #cbd5e1; margin-top:2px;">${JSON.stringify(data, null, 2)}</pre>` : ''}`;
      logsDiv.appendChild(div);
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    socket.on('connect', () => {
      statusBadge.className = 'badge badge-connected';
      statusBadge.textContent = '● Connected';
      socketIdSpan.textContent = socket.id;
      addLog('sys', `Connected to server with ID: ${socket.id}`);
    });

    socket.on('disconnect', (reason) => {
      statusBadge.className = 'badge badge-disconnected';
      statusBadge.textContent = '● Disconnected';
      socketIdSpan.textContent = 'Not connected';
      addLog('sys', `Disconnected: ${reason}`);
    });

    socket.on('market_update', (data) => {
      addLog('in', `market_update received:`, data);
    });

    socket.on('room_notice', (data) => {
      addLog('in', `room_notice:`, data);
    });

    socket.on('pong_response', (data) => {
      const latency = Date.now() - data.echo.clientTime;
      addLog('in', `Pong received! Latency: ${latency}ms`, data);
    });

    document.getElementById('btn-ping').addEventListener('click', () => {
      const clientTime = Date.now();
      addLog('out', `Emitting ping_check...`);
      socket.emit('ping_check', { clientTime }, (ack) => {
        const latency = Date.now() - ack.echo.clientTime;
        addLog('in', `Ack received! Round-trip: ${latency}ms`, ack);
      });
    });

    document.getElementById('btn-reconnect').addEventListener('click', () => {
      socket.disconnect().connect();
    });

    document.getElementById('btn-join').addEventListener('click', () => {
      const room = document.getElementById('room-input').value.trim();
      if (!room) return alert('Enter a room name');
      socket.emit('join_room', room, (res) => {
        if (res.success) {
          joinedRooms.add(room);
          activeRoomsSpan.textContent = Array.from(joinedRooms).join(', ');
          addLog('out', `Joined room "${room}" successfully.`);
        }
      });
    });

    document.getElementById('btn-leave').addEventListener('click', () => {
      const room = document.getElementById('room-input').value.trim();
      if (!room) return alert('Enter a room name');
      socket.emit('leave_room', room, (res) => {
        if (res.success) {
          joinedRooms.delete(room);
          activeRoomsSpan.textContent = joinedRooms.size ? Array.from(joinedRooms).join(', ') : 'None';
          addLog('out', `Left room "${room}".`);
        }
      });
    });

    document.getElementById('btn-send').addEventListener('click', () => {
      const room = document.getElementById('target-room').value.trim();
      const message = document.getElementById('msg-input').value.trim();
      if (!message) return alert('Enter a message');

      const payload = {
        room: room || null,
        message,
        data: { text: message }
      };
      socket.emit('market_broadcast', payload);
      addLog('out', `Emitted market_broadcast:`, payload);
      document.getElementById('msg-input').value = '';
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      logsDiv.innerHTML = '';
    });
  </script>
</body>

</html>
